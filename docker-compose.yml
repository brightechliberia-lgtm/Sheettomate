services:
  postgres:
    image: postgres:16-alpine
    container_name: sheetomate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheetomate
      POSTGRES_PASSWORD: sheetomate
      POSTGRES_DB: sheetomate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheetomate -d sheetomate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sheetomate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: sheetomate-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sheetomate:sheetomate@postgres:5432/sheetomate?schema=public
      CLIENT_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/node_modules
      - /app/server/node_modules
      - server_uploads:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: sheetomate-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/node_modules
      - /app/client/node_modules

volumes:
  postgres_data:
  server_uploads:
